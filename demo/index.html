<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>ВЕРНЁМ — интерактивное демо</title>
<meta name="description" content="Виртуальное демо кэшбэк-платформы ВЕРНЁМ: регистрация партнёра, сайт, покупка, кэшбэк, ЛК клиента, терминал.">
<meta property="og:title" content="ВЕРНЁМ — интерактивное демо">
<meta property="og:image" content="https://verniom.github.io/og.jpg">
<meta property="og:url" content="https://verniom.github.io/demo/">
<meta name="theme-color" content="#F5F5F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--text:#1B2430;--grey:#6E6E73;--grey2:#86868B;--border:#E4E7EC;--brand:#0FAE9E;--brand-d:#0A8A7D;--tint:#E6F7F5;--dark:#123B52;--dark2:#0c2a3d;--acc:#7CE0C9;--amber:#B8830A;--amber-t:#FBF2E0;--green:#1E9E6B;--red:#DC4C3E;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit}
a{color:var(--brand-d)}
.top{position:sticky;top:0;z-index:30;background:rgba(245,245,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
.top .in{max-width:1240px;margin:0 auto;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brand);display:inline-block}
.badge{font-size:11px;font-weight:600;color:var(--brand-d);background:var(--tint);padding:3px 8px;border-radius:20px}
.sp{flex:1}
.pill{font-size:13px;font-weight:500;background:#fff;border:1px solid var(--border);border-radius:980px;padding:7px 12px;white-space:nowrap}
.pill b{font-weight:600}
.ghost{background:none;border:1px solid var(--border);border-radius:980px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--grey);cursor:pointer;white-space:nowrap}
.ghost:hover{color:var(--ink)}
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:28px;padding:24px 16px 80px}
.steps{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:4px}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:none;background:none;text-align:left;cursor:pointer;color:var(--grey);font-weight:500;font-size:15px;min-height:48px}
.st .n{width:28px;height:28px;border-radius:50%;border:1.5px solid #D2D2D7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;background:#fff}
.st.done .n{background:var(--brand);border-color:var(--brand);color:#fff}
.st.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px -10px rgba(0,0,0,.15)}
.st.on .n{border-color:var(--brand);color:var(--brand-d)}
.st.done.on .n{color:#fff}
.st:disabled{opacity:.45;cursor:not-allowed}
main{min-width:0}
h1{font-weight:500;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0 0 6px;line-height:1.1}
.lead{color:var(--grey);font-size:17px;margin:0 0 22px;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--brand-d);text-transform:uppercase;margin-bottom:8px}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px -18px rgba(0,0,0,.18)}
.card+.card{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-size:13px;color:var(--grey);margin-bottom:6px;font-weight:500}
input.i{width:100%;height:50px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:17px;background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
input.i:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--tint)}
input.i[readonly]{background:#FAFAFB;color:var(--grey)}
.hint{font-size:12.5px;color:var(--grey2);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:980px;border:none;background:var(--brand);color:#fff;font-weight:600;font-size:16px;cursor:pointer;transition:background .15s,transform .1s;text-decoration:none}
.btn:hover{background:var(--brand-d)}.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn.sec:hover{background:#FAFAFB}
.btn.wide{width:100%}
.btn:disabled{background:#C7C7CC;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{min-height:44px;padding:0 18px;border-radius:980px;border:1px solid var(--border);background:#fff;font-weight:500;cursor:pointer;font-size:15px}
.chip.on{background:var(--tint);border-color:var(--brand);color:var(--brand-d);font-weight:600}
.demo-banner{display:flex;gap:10px;align-items:center;background:var(--amber-t);color:#7a5806;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500;margin-bottom:16px}
.ok-banner{display:flex;gap:10px;align-items:center;background:var(--tint);color:var(--brand-d);border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:500;margin:14px 0}
.bankcard{border-radius:18px;padding:20px;color:#fff;background:linear-gradient(135deg,#123B52 0%,#0c2a3d 55%,#0FAE9E 140%);aspect-ratio:1.6/1;max-width:360px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 40px -20px rgba(18,59,82,.6);margin-bottom:18px}
.bankcard .chipi{width:42px;height:30px;border-radius:6px;background:linear-gradient(135deg,#e9d8a6,#c9a95c)}
.bankcard .num{font-size:20px;letter-spacing:.12em;font-weight:500}
.bankcard .meta{display:flex;justify-content:space-between;font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.opt{border:1.5px solid var(--border);border-radius:var(--r);padding:20px;cursor:pointer;background:#fff;text-align:left;width:100%;transition:border .15s,box-shadow .15s}
.opt:hover,.opt.on{border-color:var(--brand);box-shadow:0 0 0 4px var(--tint)}
.opt h3{margin:0 0 4px;font-weight:600;font-size:17px}
.opt p{margin:0;color:var(--grey);font-size:14px}
pre.code{background:#0d1117;color:#c9d1d9;border-radius:12px;padding:14px;font-size:12.5px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:10px 0}
.log{background:#0d1117;color:#9fe8d8;border-radius:12px;padding:14px;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:150px}
.log div{opacity:0;animation:fi .3s forwards}
@keyframes fi{to{opacity:1}}
/* browser + landing */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.browser{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 20px 50px -24px rgba(0,0,0,.3)}
.bbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#F2F2F4;border-bottom:1px solid var(--border)}
.bbar i{width:10px;height:10px;border-radius:50%;background:#D2D2D7;display:inline-block}
.url{flex:1;background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.land{font-family:Inter,sans-serif;color:#2b1d14;background:#FBF7F2}
.land .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-weight:600}
.land .nav small{font-weight:500;color:#8a6f5a;font-size:12px}
.land .hero{padding:26px 20px 30px;background:radial-gradient(600px 300px at 80% 0%,#f1dfc9,transparent),#FBF7F2}
.land .hero h2{font-size:clamp(26px,4.5vw,38px);letter-spacing:-.03em;font-weight:600;margin:0 0 6px;line-height:1.1}
.land .hero p{margin:0;color:#7b6252}
.land .cbk{display:inline-flex;gap:6px;align-items:center;margin-top:14px;background:#fff;border-radius:980px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--brand-d);box-shadow:0 4px 14px -8px rgba(0,0,0,.25)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 20px 24px}
.mi{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mi .em{width:100%;aspect-ratio:1.4/1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,#f3e6d6,#ead2b8)}
.mi b{font-weight:600;font-size:15px}
.mi .pr{color:#7b6252;font-size:14px}
.mi button{margin-top:6px;min-height:42px;border:none;border-radius:980px;background:#2b1d14;color:#fff;font-weight:600;cursor:pointer}
.land .foot{padding:14px 20px;font-size:11.5px;color:#8a6f5a;border-top:1px solid #efe4d6;display:flex;justify-content:space-between}
/* phone */
.phone{width:300px;max-width:100%;margin:0 auto;border-radius:48px;padding:11px;background:linear-gradient(135deg,#8f98a2,#2a2f36 40%,#4b535c 80%,#a3acb6);box-shadow:0 30px 60px -25px rgba(16,24,40,.45)}
.screen{border-radius:38px;overflow:hidden;background:#fff;height:600px;position:relative;display:flex;flex-direction:column}
.isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:16px;background:#05070a;z-index:3}
.sbar{height:44px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px 6px;font-size:13px;font-weight:600;flex-shrink:0}
.lock{flex:1;background:linear-gradient(160deg,#1c4a63,#0b2333 60%,#0a1a26);color:#fff;padding:20px 12px;display:flex;flex-direction:column}
.lock .time{text-align:center;font-size:58px;font-weight:300;letter-spacing:-.03em;line-height:1;margin-top:8px}
.lock .date{text-align:center;font-size:14px;opacity:.8;margin-bottom:20px}
.sms{background:rgba(255,255,255,.88);color:#111;border-radius:18px;padding:12px 14px;font-size:13.5px;backdrop-filter:blur(10px);transform:translateY(-30px) scale(.96);opacity:0;transition:all .5s cubic-bezier(.2,.9,.3,1.2);margin-bottom:8px}
.sms.show{transform:none;opacity:1}
.sms .h{display:flex;justify-content:space-between;font-size:12px;color:#555;margin-bottom:3px}
.sms .h b{color:#111;font-weight:600}
.sms a{font-weight:600;color:#0a6cff;text-decoration:underline;cursor:pointer}
.empty{opacity:.6;text-align:center;font-size:13px;margin-top:30px}
/* client lk */
.lk{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:12px}
.lk .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.bal{background:linear-gradient(160deg,var(--dark),var(--dark2));color:#fff;border-radius:16px;padding:16px;margin-bottom:10px}
.bal .t{font-size:11px;font-weight:600;color:var(--acc);letter-spacing:.04em}
.bal .s{font-size:30px;font-weight:700;margin:2px 0}
.bal p{margin:0;font-size:12px;color:#B9C6CE}
.lkc{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.lkc h4{margin:0 0 6px;font-size:13.5px;font-weight:600}
.hr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F1F3;font-size:12.5px}
.hr:last-child{border:none}
.hr small{display:block;color:var(--grey2);font-size:11px}
.plus{color:var(--green);font-weight:600}.minus{color:var(--amber);font-weight:600}
.pinrow{display:flex;gap:8px}
.pinrow input{flex:1;min-width:0;width:100%;height:44px;border:1px solid var(--border);border-radius:10px;text-align:center;font-size:18px;letter-spacing:.4em}
.pinrow button{height:44px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;padding:0 12px;cursor:pointer}
/* breakdown */
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0F1F3;font-size:15px}
.kv:last-child{border:none}
.kv span{color:var(--grey)}
/* terminal */
.term{width:320px;max-width:100%;margin:0 auto;background:linear-gradient(180deg,#2a2f36,#14171b);border-radius:34px;padding:18px 18px 22px;box-shadow:0 30px 60px -25px rgba(16,24,40,.5)}
.tscr{background:#EAF7F4;border-radius:16px;min-height:200px;padding:16px;color:#0d2b27;display:flex;flex-direction:column}
.tscr .lbl{font-size:12px;font-weight:600;color:var(--brand-d);letter-spacing:.06em;text-transform:uppercase}
.tscr .val{font-size:26px;font-weight:600;letter-spacing:.02em;margin:8px 0;min-height:36px;word-break:break-all}
.tscr .sub{font-size:13px;color:#3d5c57}
.tscr .kv{font-size:14px;padding:6px 0;border-color:#cfe9e3}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.key{height:56px;border-radius:14px;border:none;background:#3a4048;color:#fff;font-size:22px;font-weight:500;cursor:pointer}
.key:active{background:#4b525b}
.key.ok{background:var(--brand)}.key.del{background:#5a3a3a;font-size:18px}
.tlogo{display:flex;justify-content:space-between;color:#9aa3ad;font-size:12px;margin-bottom:12px;font-weight:500}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpi .k{font-size:12.5px;color:var(--grey)}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.kpi.dk{background:linear-gradient(160deg,var(--dark),var(--dark2));color:#fff}.kpi.dk .k{color:#B9C6CE}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #F0F1F3}
th{font-size:12px;color:var(--grey);font-weight:500;background:#FAFBFC}
td.n,th.n{text-align:right}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(20,20,22,.45);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:420px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.modal h3{margin:0 0 4px;font-weight:600;font-size:20px;letter-spacing:-.02em}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--tint);border-top-color:var(--brand);animation:sp 1s linear infinite;margin:6px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.ptxt{text-align:center;color:var(--grey);font-size:15px;min-height:22px}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1D1D1F;color:#fff;border-radius:980px;padding:11px 18px;font-size:14px;font-weight:500;opacity:0;transition:all .3s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.vnote{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;font-size:11.5px;color:var(--grey);background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:980px;padding:5px 10px;backdrop-filter:blur(8px)}
.next{margin-top:18px}
.flab{font-size:13px;color:var(--grey);font-weight:500;margin-bottom:8px}
.itiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.itile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:1.5px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;font-family:inherit;min-height:96px;text-align:center}
.itile span{font-size:12.5px;font-weight:500;line-height:1.2;color:var(--ink)}.itile small{font-size:11px;color:var(--grey2)}
.itile.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--tint)}
.bk{background:#fff}
.bkh{background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.14) 0 60px,transparent 61px),radial-gradient(circle at 10% 90%,rgba(255,255,255,.08) 0 80px,transparent 81px),linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 16px 34px}
.bktop{display:flex;align-items:center;gap:8px;margin-bottom:8px}.bkb{font-weight:500;font-size:16px}
.ava.onDark{background:rgba(255,255,255,.92);border-radius:10px;padding:3px}
.bkx{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.bkrow{display:flex;gap:12px;align-items:baseline;width:100%;padding:7px 0;background:none;border:none;color:#fff;text-align:left;font-family:inherit;font-size:15px;cursor:pointer}
.bkrow:disabled{cursor:default}.bkrow b{width:84px;flex-shrink:0;font-weight:600}.bkrow span{opacity:.7}.bkrow span.set{opacity:1}
.bks{background:#fff;border-radius:24px 24px 0 0;margin-top:-20px;position:relative;padding:20px 16px 18px;min-height:360px}
.bks h3{margin:0 0 12px;font-weight:600;font-size:20px;color:var(--a);letter-spacing:-.01em}
.tgl{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:#4A5260;margin-bottom:12px;cursor:pointer}.tgl input{display:none}
.tgl i{width:44px;height:24px;border-radius:12px;background:#D5D9E0;position:relative;transition:background .2s}.tgl i:after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tgl input:checked+i{background:var(--a)}.tgl input:checked+i:after{left:22px}
.chips2,.ccats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}.chips2::-webkit-scrollbar,.ccats::-webkit-scrollbar{display:none}
.chips2 button,.ccats button{flex-shrink:0;border:none;background:#F2F4F7;border-radius:980px;padding:10px 16px;font-family:inherit;font-size:14px;color:#4A5260;cursor:pointer;min-height:40px}
.ccats button{background:#fff}.chips2 button.on,.ccats button.on{background:var(--a);color:#fff}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scard{border:none;background:none;padding:0;text-align:left;cursor:pointer;font-family:inherit;color:#1B2430}
.scard .im{display:block;position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden}.scard .im svg{position:absolute;left:50%;top:44%;width:56%;height:70%;transform:translate(-50%,-50%)}
.scard em{position:absolute;right:0;bottom:0;background:var(--a);color:#fff;font-style:normal;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:14px 0 0 0}
.scard b{display:block;margin-top:8px;font-size:15px;font-weight:600;line-height:1.25}.scard small{color:#8A94A6;font-size:12.5px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt2{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1.5px solid #E4E7EC;border-radius:16px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;border:1px solid #EEF0F3;border-radius:16px;background:#fff;cursor:pointer;font-family:inherit;text-align:left}
.mav{width:44px;height:44px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;opacity:.9;flex-shrink:0}
.mi2{flex:1;min-width:0}.mi2 b{display:block;font-weight:600;font-size:15px}.mi2 small{color:#8A94A6;font-size:12.5px}.mnear{font-size:12px;color:var(--a);background:#F2F4F7;border-radius:980px;padding:5px 9px;white-space:nowrap}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}.days button{flex:0 0 58px;border:1px solid #E4E7EC;border-radius:14px;background:#fff;padding:8px 0;cursor:pointer;font-family:inherit}

<script src="industries.js"></script>
<script>
(function(){
'use strict';
var KEY='verniom_demo_v2',DAY=864e5,LOW=1000;
var STEPS=[[1,'Регистрация'],[2,'Пополнение'],[3,'Сайт'],[4,'Покупка'],[5,'ЛК клиента'],[6,'Терминал'],[7,'Кабинет партнёра']];
var ADDR='ул. Братиславская, 14, Москва',HOURS='Ежедневно 8:00–22:00';
var OTHER0={name:'Автомойка «Блеск»',bal:120,exp:'15.12.2026'},OTHER1={name:'kofa',bal:120,exp:'15.12.2026'},OTHER=OTHER0;
function coffee(n){n=String(n||'').trim()||'kofa';return /кофейн|кафе|cafe|coffee|кофе(?![а-яё])/i.test(n)?n:'кофейня '+n;}
function logo(sz,cls){return VI.mark(indKey(),sz||40,cls);}
function initAva(n,sz,bg){sz=sz||40;var ch=String(n).replace(/^[^«]*«/,'').charAt(0).toUpperCase();return '<svg class="ava" width="'+sz+'" height="'+sz+'" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="'+(bg||'#E6F7F5')+'"/><text x="32" y="41" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" font-weight="600" fill="#0A8A7D">'+ch+'</text></svg>';}
function qn(n){n=String(n);return /[«"]/.test(n)?n:'«'+n+'»';}

var MENU=[['cup','Капучино',225],['latte','Латте медовый',275],['iced','Айс латте',295],['raf','Раф ванильный',285],['flat','Флэт уайт',245],['pumpkin','Тыквенный латте',325],['raf2','Раф пряный',315],['cookie','Печенье с шоколадом',145],['cheesecake','Чизкейк',280],['croissant','Круассан',190],['combo','Двойной комбо',375],['combo','Тройной комбо',585],['combo','Парный комбо',650],['gift','Сертификат',3000]];
function blank(){return {partner:null,site:null,clients:{},tx:[],last:null,step:1,sms:[],off:0};}
var S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){S=blank();}
if(!S.sms)S.sms=[];if(!S.off)S.off=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function r2(n){return Math.round(n*100)/100;}
function fmt(n){return r2(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function digits(s){return String(s||'').replace(/\D/g,'');}
function normPhone(s){var d=digits(s);if(d.length===10)d='7'+d;if(d.length===11&&d[0]==='8')d='7'+d.slice(1);return d;}
function fmtPhone(d){d=normPhone(d);if(d.length!==11)return d;return '+7 ('+d.slice(1,4)+') '+d.slice(4,7)+'-'+d.slice(7,9)+'-'+d.slice(9,11);}
function maskPhone(d){d=normPhone(d);return d.length===11?'+7 ••• •••-'+d.slice(7,9)+'-'+d.slice(9,11):d;}
function vnow(){return Date.now()+S.off*DAY;}
function now(){return new Date(vnow()).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function dstr(ts){return new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});}
function dshort(ts){return new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
var TR={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
function slug(s){var o=String(s).toLowerCase().split('').map(function(c){return TR[c]!==undefined?TR[c]:c;}).join('');o=o.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);return o||'partner';}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show');},2600);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function processing(lines,title){
  var ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class="modal" style="text-align:center"><div class="spin"></div><h3>'+esc(title||'Обработка')+'</h3><div class="ptxt"></div><div class="hint" style="margin-top:10px">Демо — деньги не списываются</div></div>';
  document.body.appendChild(ov);var p=$('.ptxt',ov),i=0;
  return new Promise(function(res){(function nx(){if(i<lines.length){p.textContent=lines[i++];setTimeout(nx,600);}else{ov.remove();res();}})();});
}
function client(ph){if(!S.clients[ph])S.clients[ph]={phone:ph,balance:0,pin:'1234',accrued:0,spent:0,burned:0,hist:[],last:'',lots:[]};var c=S.clients[ph];if(!c.lots)c.lots=[];if(!c.burned)c.burned=0;return c;}
function tx(o){o.t=now();o.ts=vnow();S.tx.unshift(o);}
/* ---------- bonus lots / expiry ---------- */
function addLot(c,amt){if(amt>0)c.lots.push({left:amt,exp:vnow()+S.partner.expDays*DAY});}
function spendLots(c,u){c.lots.sort(function(a,b){return a.exp-b.exp;});var r=u;c.lots.forEach(function(l){var d=Math.min(l.left,r);l.left=r2(l.left-d);r=r2(r-d);});c.lots=c.lots.filter(function(l){return l.left>0;});}
function nextExp(c){var l=c.lots.filter(function(l){return l.left>0;}).sort(function(a,b){return a.exp-b.exp;});if(!l.length)return null;var e=l[0].exp,s=0;l.forEach(function(x){if(dayKey(x.exp)===dayKey(e))s+=x.left;});return {amt:r2(s),exp:e};}
function lkLink(ph){var h=(S.site&&S.site.mode==='own'&&S.site.url)?String(S.site.url).replace(/^https?:\/\//,'').replace(/\/.*$/,''):((S.partner&&S.partner.slug)||'kofa')+'.ru';return h+'/c/'+ph.slice(-4);}
function runExpiry(from){
  if(!S.partner)return 0;var t=vnow(),p=S.partner,burnedTotal=0;
  Object.keys(S.clients).forEach(function(k){var c=client(k);
    // reminder 3 days before expiry (simulated as already sent when time jumps)
    var rem=0,remExp=0;c.lots.forEach(function(l){if(!l.rem&&l.left>0&&l.exp-3*DAY<=t){l.rem=1;rem+=l.left;remExp=l.exp;}});
    if(rem>0)S.sms.unshift({k:'rem',amt:r2(rem),exp:remExp,partner:p.name,phone:c.phone});
    var b=0;c.lots.forEach(function(l){if(l.exp<=t){b+=l.left;l.left=0;}});c.lots=c.lots.filter(function(l){return l.left>0;});b=r2(b);
    if(b>0){c.balance=r2(c.balance-b);c.burned=r2(c.burned+b);c.hist.unshift({t:now(),txt:'Сгорание бонусов',amount:b,d:-b});
      p.balance=r2(p.balance+b);tx({type:'expire',phone:c.phone,amount:b,ret:b});
      S.sms.unshift({k:'exp',amt:b,partner:p.name,phone:c.phone,days:p.expDays});burnedTotal+=b;}
  });
  return r2(burnedTotal);
}
function avail(n){if(n===1)return true;if(!S.partner)return false;if(n===2||n===3||n===7)return true;if(n===4)return !!S.site;if(n===5||n===6)return !!S.last;return false;}
function has(type){return S.tx.some(function(t){return t.type===type;});}
function done(n){return n===1?!!S.partner:n===2?has('topup'):n===3?!!S.site:n===4?has('purchase'):n===5?!!S.last:n===6?has('terminal'):false;}
function go(n){if(!avail(n)){toast('Сначала пройдите предыдущие шаги');return;}S.step=n;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function renderSteps(){
  $('#steps').innerHTML=STEPS.map(function(s){var n=s[0];return '<button class="st'+(S.step===n?' on':'')+(done(n)?' done':'')+'" data-step="'+n+'"'+(avail(n)?'':' disabled')+'><span class="n">'+(done(n)?'✓':(n===7?'◆':n))+'</span>'+s[1]+'</button>';}).join('');
  $$('#steps .st').forEach(function(b){b.onclick=function(){go(+b.dataset.step);};});
  var on=$('#steps .st.on');if(on&&window.innerWidth<=820){try{var st=$('#steps');st.scrollLeft=on.offsetLeft-st.clientWidth/2+on.offsetWidth/2;}catch(e){}}

function payModal(title,price,note){
  var m=[null,title,price];var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="modal"><h3>'+esc(m[1])+' — '+fmt(m[2])+'</h3>'+(note?'<p class="hint" style="margin:2px 0 8px">'+esc(note)+'</p>':'')+'<p class="lead" style="font-size:14.5px;margin-bottom:16px">Кэшбэк '+S.partner.cb+'% = '+fmt(m[2]*S.partner.cb/100)+' придёт на номер телефона</p>'+
  '<form id="fb"><label class="f"><span>Телефон клиента</span><input class="i" name="phone" type="tel" inputmode="tel" required value="'+(S.last?fmtPhone(S.last):'+7 (916) 555-12-34')+'"></label>'+
  '<button class="btn wide" data-t="buyok">Оплатить '+fmt(m[2])+' (демо)</button><button type="button" class="btn sec wide" style="margin-top:8px" data-x>Отмена</button></form></div>';
  document.body.appendChild(ov);
  $('[data-x]',ov).onclick=function(){ov.remove();};
  $('#fb',ov).onsubmit=function(e){e.preventDefault();var ph=normPhone(e.target.phone.value);if(ph.length!==11){toast('Введите телефон +7…');return;}
    var p=S.partner,cb=r2(m[2]*p.cb/100),comm=r2(m[2]*p.comm/100);
    if(p.balance<cb+comm){ov.remove();toast('Недостаточно средств на балансе партнёра — пополните');go(2);return;}
    ov.remove();
    processing(['Оплата картой…','Начисляем кэшбэк…','Отправляем SMS…'],'Покупка').then(function(){
      p.balance=r2(p.balance-cb-comm);var c=client(ph);c.balance=r2(c.balance+cb);c.accrued=r2(c.accrued+cb);c.last=now();addLot(c,cb);
      c.hist.unshift({t:now(),txt:m[1]+' (сайт)',amount:m[2],d:cb});
      tx({type:'purchase',phone:ph,amount:m[2],cb:cb,comm:comm,item:m[1]});
      S.last=ph;S.sms.unshift({k:'cb',cb:cb,partner:p.name,phone:ph});
      CART={};bkReset();lastBreak={item:m[1],amount:m[2],cb:cb,comm:comm,cbp:p.cb,cp:p.comm};save();render();
      var box=$('#smsbox');if(box){var f=box.firstElementChild;if(f){f.classList.remove('show');requestAnimationFrame(function(){requestAnimationFrame(function(){f.classList.add('show');});});}}
      var pc=$('#phonecol');if(pc&&window.innerWidth<=980)pc.scrollIntoView({behavior:'smooth',block:'center'});
      toast('SMS отправлено клиенту');});};
}

  if(T.st==='amt')return '<div class="lbl">Сумма покупки</div><div class="val">'+(T.amt||'0')+' ₽</div><div class="sub">Бонусов у клиента: '+fmt(c?c.balance:0)+' · до '+S.partner.maxShare+'% чека</div>';
  if(T.st==='confirm'){var a=+T.amt,k=calcT(c,a);
    return '<div class="lbl">Подтверждение</div><div class="kv"><span>Сумма</span><b>'+fmt(a)+'</b></div><div class="kv"><span>Бонусами (макс. '+S.partner.maxShare+'% = '+fmt(k.cap)+')</span><b>−'+fmt(k.u)+'</b></div><div class="kv"><span>Картой к оплате</span><b>'+fmt(k.pay)+'</b></div><div class="kv"><span>Новый кэшбэк</span><b>+'+fmt(k.cb)+'</b></div><div class="sub" style="margin-top:6px">OK — оплатить</div>';}
  if(T.st==='done'){var r=T.res;return '<div class="lbl">Готово</div><div class="val" style="color:var(--green)">✓ Оплачено</div><div class="sub">Списано бонусов: '+fmt(r.used)+'<br>Картой: '+fmt(r.pay)+'<br>Начислено: +'+fmt(r.cb)+'<br>Баланс клиента: '+fmt(r.bal)+'</div><div class="sub" style="margin-top:8px">OK — новая операция</div>';}
  return '';
}

  return head('Шаг 6','Оплата бонусами в терминале','Клиент называет телефон и PIN — бонусы списываются прямо на кассе (до '+p.maxShare+'% чека).')+
  '<div class="stage s6"><div><div class="term"><div class="tlogo"><span>● ВЕРНЁМ POS</span><span>'+esc(p.name)+'</span></div><div class="tscr" id="tscr">'+tscreen()+'</div>'+
  '<div class="keys">'+['1','2','3','4','5','6','7','8','9','del','0','ok'].map(function(k){return '<button class="key'+(k==='ok'?' ok':k==='del'?' del':'')+'" data-k="'+k+'">'+(k==='ok'?'OK':k==='del'?'⌫':k)+'</button>';}).join('')+'</div></div><p class="hint" style="text-align:center">Терминал (макет) · можно печатать с клавиатуры</p></div>'+
  '<div><div class="card"><div class="eyebrow">Балансы</div><div class="kv"><span>Клиент '+esc(maskPhone(S.last))+'</span><b data-t="tcb">'+fmt(c?c.balance:0)+'</b></div><div class="kv"><span>Партнёр '+esc(qn(p.name))+'</span><b>'+fmt(p.balance)+'</b></div><div class="hint">PIN клиента: '+esc(c?c.pin:'1234')+' (подсказка для демо) · правило: бонусами не более '+p.maxShare+'% чека · списываются только бонусы сети '+esc(qn(p.name))+'</div></div>'+
  '<div class="card"><div class="eyebrow">История операций</div>'+(S.tx.filter(function(t){return t.type==='purchase'||t.type==='terminal';}).slice(0,5).map(function(t){return '<div class="kv"><span>'+(t.type==='terminal'?'Терминал'+(t.used?' · бонусами −'+fmt(t.used):''):'Сайт: '+esc(t.item))+' · '+esc(maskPhone(t.phone))+'</span><b>'+fmt(t.amount)+'</b></div>';}).join('')||'<div class="hint">Пока нет</div>')+
  (done(6)?'<button class="btn wide next" data-t="to7">Открыть кабинет партнёра →</button>':'')+'</div></div></div>';
}
function tkey(k){
  if(T.st==='done'){if(k==='ok'){T={st:'phone',ph:'',pin:'',amt:'',res:null};}refreshT();return;}
  if(k==='del'){if(T.st==='phone')T.ph=T.ph.slice(0,-1);else if(T.st==='pin')T.pin=T.pin.slice(0,-1);else if(T.st==='amt')T.amt=T.amt.slice(0,-1);else if(T.st==='confirm')T.st='amt';refreshT();return;}
  if(k==='ok'){
    if(T.st==='phone'){var ph=normPhone(T.ph||S.last||'');if(!S.clients[ph]){toast('Клиент не найден — сначала покупка на сайте');return;}T.ph=fmtPhone(ph);T.st='pin';}
    else if(T.st==='pin'){var c=S.clients[normPhone(T.ph)];if(T.pin!==c.pin){toast('Неверный PIN');T.pin='';refreshT();return;}T.st='amt';}
    else if(T.st==='amt'){if(!(+T.amt>0)){toast('Введите сумму');return;}T.st='confirm';}
    else if(T.st==='confirm'){payT();return;}
    refreshT();return;
  }
  if(T.st==='phone'&&digits(T.ph).length<11)T.ph+=k;
  else if(T.st==='pin'&&T.pin.length<4)T.pin+=k;
  else if(T.st==='amt'&&T.amt.length<6&&!(T.amt===''&&k==='0'))T.amt+=k;
  refreshT();
}
function payT(){
  var ph=normPhone(T.ph),c=client(ph),p=S.partner,a=+T.amt,k=calcT(c,a);
  if(p.balance<k.cb+k.comm){toast('Недостаточно средств у партнёра — пополните баланс');return;}
  processing(['Проверяем PIN…','Списываем бонусы…','Оплата картой…'],'Терминал').then(function(){
    spendLots(c,k.u);addLot(c,k.cb);
    c.balance=r2(c.balance-k.u+k.cb);c.spent=r2(c.spent+k.u);c.accrued=r2(c.accrued+k.cb);c.last=now();
    if(k.u>0)c.hist.unshift({t:now(),txt:'Оплата бонусами (терминал)',amount:a,d:-k.u});
    if(k.cb>0)c.hist.unshift({t:now(),txt:'Кэшбэк (терминал)',amount:k.pay,d:k.cb});
    p.balance=r2(p.balance-k.cb-k.comm);
    tx({type:'terminal',phone:ph,amount:a,used:k.u,paid:k.pay,cb:k.cb,comm:k.comm});S.last=ph;
    T.res={used:k.u,pay:k.pay,cb:k.cb,bal:c.balance};T.st='done';save();render();toast('Оплачено: бонусами '+fmt(k.u));});
}
function refreshT(){var s=$('#tscr');if(s)s.innerHTML=tscreen();}
function b6(){

  var t=$('[data-t=to7]');if(t)t.onclick=function(){go(7);};
}
document.addEventListener('keydown',function(e){if(S.step!==6||/input|textarea/i.test((e.target||{}).tagName||''))return;if(/^\d$/.test(e.key))tkey(e.key);else if(e.key==='Backspace')tkey('del');else if(e.key==='Enter')tkey('ok');});
/* ---------- STEP 7: partner cabinet ---------- */
function stats(){var s={acc:0,used:0,comm:0,top:0,turn:0,burn:0};S.tx.forEach(function(t){if(t.type==='topup')s.top+=t.amount;else if(t.type==='expire')s.burn+=t.amount;else{s.acc+=t.cb||0;s.used+=t.used||0;s.comm+=t.comm||0;s.turn+=t.amount||0;}});for(var k in s)s[k]=r2(s[k]);return s;}
function typeName(t){return t.type==='topup'?'Пополнение':t.type==='terminal'?'Терминал':t.type==='expire'?'Сгорание бонусов':'Сайт · '+t.item;}
function chart(){
  var act=S.tx.filter(function(t){return t.cb||t.used;}),last=act.length?act[0].ts:vnow(),days=[];
  for(var i=6;i>=0;i--){var ts=last-i*DAY;days.push({k:dayKey(ts),l:dshort(ts),a:0,u:0});}
  S.tx.forEach(function(t){var d=days.filter(function(x){return x.k===dayKey(t.ts);})[0];if(d){d.a+=t.cb||0;d.u+=t.used||0;}});
  var mx=Math.max.apply(null,days.map(function(d){return Math.max(d.a,d.u);}).concat([1])),W=700,H=180,bw=W/7;
  var g=days.map(function(d,i){var x=i*bw,ha=d.a/mx*(H-40),hu=d.u/mx*(H-40);
    return '<rect x="'+(x+bw*.2)+'" y="'+(H-22-ha)+'" width="'+(bw*.28)+'" height="'+ha+'" rx="4" fill="#0FAE9E"/><rect x="'+(x+bw*.52)+'" y="'+(H-22-hu)+'" width="'+(bw*.28)+'" height="'+hu+'" rx="4" fill="#E0B254"/><text x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="12" fill="#86868B">'+d.l+'</text>';}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="График по дням"><line x1="0" x2="'+W+'" y1="'+(H-22)+'" y2="'+(H-22)+'" stroke="#E4E7EC"/>'+g+'</svg><div class="legend"><span><i style="background:#0FAE9E"></i>Начислено</span><span><i style="background:#E0B254"></i>Оплачено бонусами</span></div>';
}
function v7(){
  var p=S.partner,cl=Object.keys(S.clients).map(function(k){return S.clients[k];}),s=stats();
  var notes=S.sms.filter(function(m){return m.k==='rem'||m.k==='exp';});
  return head('Кабинет партнёра','<span class="hlogo">'+logo(44)+esc(p.name)+'</span>','Клиенты, начисления, списания, баланс и правила программы.')+
  (p.balance<LOW?'<div class="warn">⚠︎ Низкий баланс: '+fmt(p.balance)+'. При нуле кэшбэк перестанет начисляться. <button class="btn" data-t="topup" style="min-height:40px;padding:0 16px;font-size:14px">Пополнить</button></div>':'')+
  '<div class="kpis"><div class="kpi dk"><div class="k">Баланс</div><div class="v">'+fmt(p.balance)+'</div></div><div class="kpi"><div class="k">Клиентов</div><div class="v">'+cl.length+'</div></div><div class="kpi"><div class="k">Начислено бонусов</div><div class="v">'+fmt(s.acc)+'</div></div><div class="kpi"><div class="k">Оплачено бонусами</div><div class="v">'+fmt(s.used)+'</div></div><div class="kpi"><div class="k">Комиссия платформы</div><div class="v">'+fmt(s.comm)+'</div></div></div>'+
  '<div class="grid2"><div class="card"><div class="eyebrow">Настройки программы</div><form id="f7">'+
   '<label class="f"><span>Кэшбэк клиентам, %</span><input class="i" name="cb" type="number" inputmode="decimal" min="1" max="30" step="0.5" value="'+p.cb+'"></label>'+
   '<label class="f"><span>Максимум чека бонусами, %</span><input class="i" name="ms" type="number" inputmode="numeric" min="0" max="100" value="'+p.maxShare+'"></label>'+
   '<label class="f"><span>Бонусы сгорают через, дней</span><input class="i" name="ed" type="number" inputmode="numeric" min="1" max="730" value="'+p.expDays+'"></label>'+
   '<button class="btn wide" data-t="savecfg">Сохранить настройки</button></form></div>'+
  '<div class="card"><div class="eyebrow">Сгорание бонусов</div><p style="margin:0 0 10px">Правило: бонусы сгорают через <b>'+p.expDays+' дн.</b> после начисления. За 3 дня клиенту приходит SMS-напоминание.</p>'+
   '<div class="kv"><span>Дата в демо</span><b data-t="vdate">'+dstr(vnow())+(S.off?' (+'+S.off+' дн.)':'')+'</b></div><div class="kv"><span>Сгорело всего</span><b>'+fmt(s.burn)+'</b></div>'+
   '<button class="btn sec wide next" data-t="ff">⏩ Перемотать время +30 дней</button>'+
   '<div class="minisms">'+(notes.length?notes.slice(0,2).map(smsHtml).join(''):'<div class="empty">Здесь появятся SMS о сгорании</div>')+'</div></div></div>'+
  '<div class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow" style="margin:0">По дням</div></div>'+chart()+'</div>'+
  '<div class="card"><div class="eyebrow">Клиенты</div><div class="tw"><table><tr><th>Телефон</th><th class="n">Баланс</th><th class="n">Начислено</th><th class="n">Потрачено</th><th class="n">Сгорело</th><th>Последняя операция</th></tr>'+
  (cl.length?cl.map(function(c){return '<tr><td>'+esc(maskPhone(c.phone))+'</td><td class="n"><b>'+fmt(c.balance)+'</b></td><td class="n plus">+'+fmt(c.accrued)+'</td><td class="n minus">−'+fmt(c.spent)+'</td><td class="n">'+fmt(c.burned||0)+'</td><td>'+esc(c.last)+'</td></tr>';}).join(''):'<tr><td colspan="6" class="hint">Клиентов пока нет</td></tr>')+'</table></div></div>'+
  '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="eyebrow" style="margin:0">Операции</div><button class="btn sec" data-t="csv" style="min-height:42px;font-size:14px">⤓ Excel</button></div><div class="tw"><table><tr><th>Время</th><th>Тип</th><th>Клиент</th><th class="n">Сумма</th><th class="n">Кэшбэк</th><th class="n">Бонусами</th><th class="n">Комиссия</th></tr>'+
  (S.tx.length?S.tx.slice(0,40).map(function(t){return '<tr><td>'+t.t+'</td><td>'+esc(typeName(t))+'</td><td>'+(t.phone?esc(maskPhone(t.phone)):'—')+'</td><td class="n">'+fmt(t.amount)+'</td><td class="n">'+(t.cb?'+'+fmt(t.cb):'—')+'</td><td class="n">'+(t.used?'−'+fmt(t.used):'—')+'</td><td class="n">'+(t.comm?fmt(t.comm):'—')+'</td></tr>';}).join(''):'<tr><td colspan="7" class="hint">Операций пока нет</td></tr>')+'</table></div>'+
  '<p class="hint">Пополнено всего: '+fmt(s.top)+'. Сгоревшие бонусы возвращаются на баланс партнёра. Комиссия '+p.comm+'% — значение для примера.</p></div>';
}
function csv(){
  var q=function(v){v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;},n=function(x){return x?String(r2(x)).replace('.',','):'0';};
  var L=[['ВЕРНЁМ — демо-выгрузка',S.partner.name],[],['Операции'],['Время','Тип','Клиент','Сумма','Кэшбэк','Бонусами','Комиссия']];
  S.tx.forEach(function(t){L.push([t.t,typeName(t),t.phone?maskPhone(t.phone):'',n(t.amount),n(t.cb),n(t.used),n(t.comm)]);});
  L.push([],['Клиенты'],['Телефон','Баланс','Начислено','Потрачено','Сгорело']);
  Object.keys(S.clients).forEach(function(k){var c=S.clients[k];L.push([maskPhone(c.phone),n(c.balance),n(c.accrued),n(c.spent),n(c.burned)]);});
  L.push([],['Баланс партнёра',n(S.partner.balance)]);
  var blob=new Blob(['\ufeff'+L.map(function(r){return r.map(q).join(';');}).join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verniom-demo-'+S.partner.slug+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast('Файл CSV для Excel скачан');
}

  $('#f7').onsubmit=function(e){e.preventDefault();var f=e.target,cb=parseFloat(String(f.cb.value).replace(',','.')),ms=parseInt(f.ms.value,10),ed=parseInt(f.ed.value,10);
    if(!(cb>=1&&cb<=30)){toast('Кэшбэк: от 1 до 30%');return;}if(!(ms>=0&&ms<=100)){toast('Доля бонусами: 0–100%');return;}if(!(ed>=1&&ed<=730)){toast('Срок: 1–730 дней');return;}
    var p=S.partner;p.cb=cb;p.maxShare=ms;p.expDays=ed;save();render();toast('Настройки сохранены');};
  $('[data-t=ff]').onclick=function(){S.off+=30;var b=runExpiry();save();render();toast(b>0?'Прошло 30 дней: сгорело '+fmt(b):'Прошло 30 дней — сгоревших бонусов нет');};
  $('[data-t=csv]').onclick=csv;bindLk();
}
