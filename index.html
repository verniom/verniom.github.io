/* Hidden visitor counter (abacus.jasoncameron.dev, namespace "verniom"). Host-independent: works on any domain.
   visits: every page load; uniques: once per browser (localStorage); pdf: each "Скачать PDF" click. Nothing is shown on the page. */
(function(){try{
  var A='https://abacus.jasoncameron.dev/hit/verniom/';
  function hit(k){try{fetch(A+k,{mode:'cors',keepalive:true,cache:'no-store'}).catch(function(){});}catch(e){}}
